name: Release — Train & Publish INT8 .b8p Router
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Train Fresh .b8p Model & Verify Held-Out Accuracy
        run: |
          node src/train-router.mts
          node --test src/algebra-router.test.mts
          sha256sum dist/algebra-router.b8p PAPER.md > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/algebra-router.b8p dist/SHA256SUMS.txt PAPER.md --title "b8g-micro-moe $TAG (53.7 KB INT8 .b8p)" --notes "Trained and verified automatically on GitHub Actions CPU runner." || gh release upload "$TAG" dist/algebra-router.b8p dist/SHA256SUMS.txt PAPER.md --clobber
